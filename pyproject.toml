[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-assessment-studio"
version = "0.0.0"
description = "Architecture starter for AI Engineering Assessment Studio"
requires-python = ">=3.12,<3.13"

[project.scripts]
ai-assessment-studio = "ai_assessment.app:main"

[project.optional-dependencies]
gui = [
    "PySide6>=6.6,<7",
    "numpy>=1.26,<3",
    "opencv-python>=4.8,<5",
    "PyYAML>=6,<7",
    "reportlab>=4,<5",
    "ultralytics>=8.3,<9",
    "onnxruntime>=1.17,<2",
    "requests>=2.31,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
test = []

[tool.setuptools.packages.find]
where = ["src"]

# Runtime dependencies will be pinned after the M1 Windows image proof.
